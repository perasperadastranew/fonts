name: Проверка библиотеки
on:
  push:
    branches: [main]
    paths: ['index.html', 'catalog.json', 'web/**', 'tools/**', 'mcp/fonts.json']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install fonttools brotli numpy freetype-py
      - run: python3 tools/check.py
