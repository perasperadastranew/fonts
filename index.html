<style>
:root{--ink:#0C0B0D;--pap:#F1EFEA;--wh:#FFFFFF;--mut:#6E6A66;--ln:rgba(12,11,13,.12);--soft:rgba(12,11,13,.06);--ok:#DFF3E4}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--pap);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.wrap{max-width:1376px;margin:0 auto;padding:0 32px}
/* шапка */
.hd{position:sticky;top:0;z-index:20;background:var(--hdbg,rgba(241,239,234,.92));backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{font-weight:600;letter-spacing:1.8px;font-size:13px;white-space:nowrap}
.logo span{font-family:'JetBrains Mono',monospace;font-weight:400;letter-spacing:.4px;color:var(--mut);margin-left:6px}
.nav{display:flex;gap:0}
.nav a,.pill{padding:9px 12px;border-radius:999px;font-size:14px;white-space:nowrap;border:0;background:transparent}
.nav a:hover,.pill:hover{background:var(--soft)}
.nav a.on{background:var(--soft)}
.pill.soft{background:var(--soft)}.pill.soft:hover{background:rgba(12,11,13,.1)}
.pill.dark{background:var(--ink);color:var(--pap);font-weight:500}.pill.dark:hover{background:#2a272b}
.hr{display:flex;gap:6px;align-items:center}
.icon{width:40px;height:40px;border-radius:999px;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center}
/* общая фраза */
.phr{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--ln)}
.phr label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;color:var(--mut);white-space:nowrap}
.phr input{flex:1;border:0;background:transparent;font:22px 'Golos Text';color:var(--ink);outline:none;min-width:0}
.sz{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
input[type=range]{accent-color:var(--ink)}
/* каталог */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:8px;margin:24px 0 8px}
.tile{position:relative;container-type:size;overflow:hidden;border-radius:calc(var(--rk,1)*24px)}
.tile .art{position:absolute;inset:0;overflow:hidden}
.intro{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.intro h1{margin:0;font-weight:400;font-size:52px;line-height:.98;letter-spacing:-2px}
.intro p{margin:0;font-size:16px;line-height:1.55;color:var(--mut)}
.cfp{display:grid;grid-template-columns:236px minmax(0,1fr);gap:36px;align-items:start;padding-top:24px}
.cside{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:none}
.cside::-webkit-scrollbar{display:none}
.cside .box{background:var(--ink);color:var(--pap);border-radius:calc(var(--rk,1)*22px);padding:18px 20px}
.cside .box b{display:block;font-size:40px;font-weight:400;letter-spacing:-1.5px;line-height:1}
.cside .box small{color:#A5A09B;font-size:12px}
.cside .box .bar{height:3px;border-radius:3px;background:rgba(241,239,234,.15);margin-top:12px;overflow:hidden}.cside .box .bar i{display:block;height:100%;background:#FF7122;transition:width .4s}
.cside h4{font:10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--mut);margin:6px 12px 2px;font-weight:400}
.cnav{display:flex;flex-direction:column;font-size:15px}
.cnav a,.cnav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:calc(var(--rk,1)*12px);transition:background .2s}
.cnav a:hover,.cnav button:hover{background:rgba(12,11,13,.05)}
.cnav .on{background:var(--wh)}
.cnav span{font:11px 'JetBrains Mono',ui-monospace,monospace;color:var(--mut)}
.cnav i{margin-left:auto;font:normal 11px 'JetBrains Mono',ui-monospace,monospace;color:var(--mut)}
.cnav .dot{width:8px;height:8px;border-radius:50%;align-self:center;flex:none}
.cnav .tg::before{content:'';width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;align-self:center;flex:none;opacity:.5}
.cnav .tg.on::before{background:#FF7122;border-color:#FF7122;opacity:1}
@media(max-width:900px){.cfp{grid-template-columns:1fr;gap:0}.cside{position:sticky;top:56px;z-index:5;max-height:none;flex-direction:row;overflow-x:auto;background:var(--pap);padding:8px 0;gap:4px}.cside .box,.cside h4,.cside .cnav.sec2{display:none}.cnav{flex-direction:row;gap:4px}.cnav a,.cnav button{white-space:nowrap;background:var(--wh);padding:7px 12px}}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:20px 0 12px}
.chip{padding:9px 14px;border-radius:999px;border:0;background:var(--soft);font-size:14px}
.chip i{font-style:normal;color:var(--mut);margin-left:4px;font-size:12px}
.chip.on{background:var(--ink);color:var(--pap)}.chip.on i{color:#A5A09B}
.sel{padding:9px 14px;border-radius:999px;border:0;background:var(--soft);font:14px 'Golos Text';color:var(--ink)}
.search{flex:0 1 240px;padding:9px 16px;border-radius:999px;border:0;background:var(--soft);font:14px 'Golos Text';color:var(--ink);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;padding:8px 0 64px}
.card{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px;min-height:240px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}

"3270":["Ricardo Bánffy", "Шрифт для тех, кто скучает по терминалам IBM 3270. Его родословная — цепочка копий: из шрифта x3270, который перевели из программы 3270tool Технологического института Джорджии, а туда он попал, когда буквы вручную срисовали с экрана настоящего терминала. Автор сделал его, потому что считал, что терминалы заслуживают красоты.", "https://github.com/rbanffy/3270font"],

"Doulos SIL":["SIL", "Открытый шрифт, задуманный для всех современных языков на латинице и кириллице. В нём почти полный набор этих алфавитов в Юникоде, множество диакритик и символов для лингвистики и обучения грамоте, а «умные» функции сами расставляют надстрочные знаки над любой буквой.", "https://github.com/silnrsi/font-doulos"],
"Fairfax":["Kreative Software", "Растровый шрифт с ячейкой 6×12 пикселей для терминалов и редакторов кода. Покрывает множество письменностей и блоков Юникода, псевдографику и даже искусственные письменности из реестра UCSUR. Позже его сменил масштабируемый Fairfax HD, но оригинал продолжают поддерживать.", "https://github.com/kreativekorp/open-relay"],
"Fantasque Sans Mono":["Jany Belluz", "Моноширинный шрифт для программирования с лёгкой «рукописной» неровностью. Раньше назывался Cosmic Sans Neue Mono: автору казалось, что в какой-то момент шрифт выглядел как дитя Comic Sans и Helvetica Neue. Среди источников вдохновения — Inconsolata, Monaco и Consolas; курсив нарисован с новыми формами букв, а не просто наклонён.", "https://github.com/belluzj/fantasque-sans"],
"Flow Block":["Dan Ross", "Шрифт-заглушка для макетов и вайрфреймов: вместо букв — блоки, которые изображают текст и не отвлекают от структуры страницы. В семье три стиля — Circular, Rounded и Block; намеренно оставлены субпиксели, наложения и прочие «несовершенства».", "https://github.com/google/fonts/tree/main/ofl/flowblock"],
"Flow Circular":["Dan Ross", "Шрифт-заглушка для макетов и вайрфреймов: слова превращаются в цепочки кружков, которые изображают текст, но не отвлекают на чтение. В семье три стиля — Circular, Rounded и Block.", "https://github.com/google/fonts/tree/main/ofl/flowcircular"],
"Flow Rounded":["Dan Ross", "Шрифт-заглушка для макетов и вайрфреймов: вместо букв — скруглённые плашки, изображающие строки текста. Позволяет показать «здесь будет текст», не отвлекая на lorem ipsum. В семье три стиля — Circular, Rounded и Block.", "https://github.com/google/fonts/tree/main/ofl/flowrounded"],
"Funever Sans Display":["AlloyDome", "Открытый гротеск в духе древнегреческих надписей. Автор называет близким по духу и источником вдохновения шрифт Lithos.", "https://github.com/AlloyDome/Funever-Sans"],
"Garamond Libre":["Daniel Benjamin Miller", "«Настоящий Гарамон» — прямое начертание по рисункам французского гравёра XVI века Клода Гарамона, курсив — по Роберу Гранжону. Греческие буквы сделаны по образцам Фирмена Дидо и Александра Уилсона. Это расширенное ответвление шрифтов Джорджа Дуроса с кириллицей, капителью, историческими лигатурами и даже византийскими нотными знаками.", "https://github.com/dbenjaminmiller/garamond-libre"],
"Guidy":["Матвей Малкин (nicl4m)", "Шрифт для навигации, рассчитанный на нужды современных кириллических языков, с 40 пиктограммами указателей прямо внутри файла. Геометрический гротеск с гуманистическими корнями; среди источников вдохновения — Avenir, Frutiger, Geometria, Gill Sans и Wayfinding Sans.", "https://github.com/collectivetypeworks/Guidy"],
"Hack":["Source Foundry", "Рабочий шрифт для исходного кода, выросший из открытых Bitstream Vera и DejaVu. Большая высота строчных, открытые формы и низкий контраст сделаны ради читаемости на типичных для кода кеглях — примерно от 8 до 14.", "https://github.com/source-foundry/Hack"],
"Hooskai Chamfered Square":["胡斯凯 (Husky)", "Квадратный шрифт со скошенными углами, который автор нарисовал сам; по его словам, название говорит о шрифте всё. Поддерживает латиницу и большую часть кириллицы.", "https://github.com/SiberiaHusky/Hooskai-Chamfered-Square"],
"Involve":["Стефан Пеев", "Вырос из проекта «Эвольвента» Алексея Кузнецова (2016) — кириллического расширения открытого URW Gothic L. В Involve переработана геометрия всех знаков с упором на точность округлых форм, расширена языковая поддержка и добавлены правильные локальные формы кириллицы для сербского, македонского и болгарского.", "https://github.com/StefanPeev/Involve"],
"Kablammo":["Vectro Type Foundry, 2023", "Экспериментальный вариативный шрифт по мотивам максималистского декора 90-х, стиля «Мемфис», мультфильмов и игрушек тех лет. Его единственная ось Morph заставляет буквы «танцевать»: декоративные элементы разлетаются, меняются толщина и контраст, поэтому шрифт особенно хорош в анимации.", "https://github.com/google/fonts/tree/main/ofl/kablammo"],
"Kazuki Reiwa":["Kazuki Kimura, 2020–2022", "Проект японского автора Кадзуки Кимуры: открытое семейство для латиницы, кириллицы, японского, греческого и шрифта Брайля. Начал с латиницы в сентябре 2020 года, кириллицу добавил в ноябре того же года, а начертания Light, Medium и Bold вышли в январе 2022-го.", "https://github.com/KazukiKimuraJP/KazukiReiwa"],
"KJV1611":["Fredrick R. Brennan", "Открытая цифровая реконструкция шрифта, которым напечатана Библия короля Якова 1611 года — одна из самых известных книг на английском. Автор рассматривал под микроскопом буквы точного репринта, обводил их и собирал шрифт; включены исторические формы вроде длинной «ſ».", "https://github.com/ctrlcctrlv/kjv1611"],
"LCD 14":["Fredrick Brennan", "Шрифт, имитирующий сегментные ЖК-индикаторы. Автор сделал его, потому что существующие «цифровые» шрифты были непоследовательны: в них встречались знаки, которые невозможно показать на настоящем индикаторе. Здесь каждый символ честно собирается из сегментов одной ячейки.", "https://github.com/ctrlcctrlv/lcd-font"],
"LINE Seed JP":["LY Corporation, Fontrix, Fontworks", "Первый собственный шрифт мессенджера LINE, построенный на геометрии и задуманный одновременно узнаваемым и универсальным. Он вырос из айдентики бренда — удобства и дружелюбия, а слово Seed («семя») передаёт идею расти вместе с пользователями.", "https://github.com/line/seed"],
"Marmelad":["Cyreal, Manvel Shmavonyan", "Шрифт для заголовков среднего и крупного размера, который благодаря спокойным пропорциям годится и для текста. Название и характер отсылают к мармеладу — мягкому и тягучему: все вертикальные штрихи скруглены у базовой линии. Поддерживает латиницу и кириллицу; в 2022 году улучшен кернинг.", "https://github.com/google/fonts/tree/main/ofl/marmelad"],
"Monocraft":["Idrees Hassan", "Моноширинный шрифт для разработчиков — фанатский проект по мотивам шрифта из интерфейса Minecraft (без файлов самой игры). Каждый из 1500 с лишним знаков перерисован под равную ширину, узким i и l добавлены хвостики и засечки, есть лигатуры для кода и даже «галактический алфавит» из стола зачарований.", "https://github.com/IdreesInc/Monocraft"],
"Neue Soviet":["Борис Журавлев", "Гротеск, вдохновлённый советским графическим дизайном 1980-х. Построен на основе шрифта Inter Расмуса Андерссона.", "https://github.com/zhuravlevb/neuesoviet"],
"NeverMind Compact":["Xmind", "Часть NeverMind — фирменной шрифтовой семьи сервиса Xmind, выросшей из его логотипа. Геометрический и одновременно гуманистический гротеск в десяти насыщенностях; помимо базового шрифта в семье больше десятка стилей — от узких и широких до рукописного, пиксельного и брускового.", "https://github.com/xmindltd/nevermind"],
"NeverMind Slab":["Xmind", "Брусковый вариант NeverMind — фирменной шрифтовой семьи Xmind, которая выросла из логотипа компании. Сама семья задумана как современная и дружелюбная, поддерживает больше сотни языков, включая русский, и включает множество стилей: округлый, рукописный, с засечками, пиксельный.", "https://github.com/xmindltd/nevermind"],
"Nobile":["Vernon Adams", "Гротеск для цифровых экранов и мобильных устройств, который при этом сохраняет выразительность, привычную для печатных шрифтов. В основе замысла — принцип Уильяма Морриса держать в доме только полезные или красивые вещи: шрифт должен хорошо читаться на экране и оставаться красивым от крупных размеров до мелкого текста.", "https://github.com/google/fonts/tree/main/ofl/nobile"],
"Overpass":["Delve Fonts (Delve Withrington, Dave Bailey, Thomas Jockin)", "Интерпретация Highway Gothic — шрифта американских дорожных знаков из стандартов Федерального управления автодорог США. Буквы доработаны так, чтобы хорошо смотреться на экране в мелких размерах, а позже и в крупных. Проект развивался при участии Red Hat.", "https://github.com/google/fonts/tree/main/ofl/overpass"],
"Overpass Mono":["Delve Fonts (Delve Withrington, Dave Bailey)", "Моноширинная версия Overpass, настроенная под нужды программистов, в пяти насыщенностях. Сам Overpass — интерпретация Highway Gothic, шрифта дорожных знаков из американских федеральных стандартов, доработанная для экрана.", "https://github.com/google/fonts/tree/main/ofl/overpassmono"],
"Phlatt Grotesk":["RandomMaerks", "Задуман как серьёзный нейтральный шрифт, несмотря на забавное название (изначально он назывался просто Flat). Вдохновлён ощущением от Inter и «плоскими» боками букв Roboto. Около 1770 знаков: латиница, греческий, кириллица с болгарскими формами, математика и МФА.", "https://github.com/RandomMaerks/Phlatt-Grotesk"],

"Prosto One":["Павел Емельянов, Jovanny Lemonad", "Результат полугодовой совместной работы двух российских дизайнеров: инициатор и главный автор Павел Емельянов делал его вместе с наставником Иваном Гладких (Jovanny Lemonad), который помог с технической доводкой. Задумывался как современный акцидентный гротеск для логотипов и презентаций.", "https://github.com/google/fonts/tree/main/ofl/prostoone"],
"Seymour One":["Vernon Adams", "Вырос из более раннего веб-шрифта Sigmar One, но на его формы повлияли и британские гротески конца XIX — начала XX века. Получился жирный, простой и немного озорной заголовочный шрифт, который можно набирать и обычно, и одними прописными. В 2023 году набор знаков расширили.", "https://github.com/google/fonts/tree/main/ofl/seymourone"],
"SN Pro":["Supernotes, Tobias Whetton", "Дружелюбный гротеск, сделанный сервисом заметок Supernotes для себя и оптимизированный под Markdown. Основа — Nunito Вернона Адамса, но каждый знак переработан ради читаемости в этом контексте.", "https://github.com/google/fonts/tree/main/ofl/snpro"],
"Tiny5 Duo":["Stefan Schmidt", "Жирная пара к Tiny5 — компактному пятипиксельному шрифту в духе цифрового минимализма 1980–90-х. Там, где Tiny5 рисует штрих в один пиксель, Duo удваивает вертикальные штрихи. Шесть вариативных осей позволяют менять вид от чётких ЖК-граней до свечения ЭЛТ-монитора и растекания чернил матричного принтера.", "https://github.com/google/fonts/tree/main/ofl/tiny5duo"],
"Xmind":["Xmind", "Фирменный шрифт сервиса Xmind, выросший из его логотипа. Сочетает геометрические и гуманистические черты, существует в девяти насыщенностях и поддерживает больше сотни языков, включая русский.", "https://github.com/google/fonts/tree/main/ofl/xmind"],
"Ysabeau Infant":["Christian Thalmann (Catharsis Fonts)", "Ysabeau соединяет знакомые формы гарамондовской традиции с чистотой малоконтрастного гротеска и сохраняет широкий шаг и длинные выносные элементы книжного шрифта ради комфортного чтения. Хорошо сочетается с EB Garamond и Cormorant; поддерживает латиницу, греческий и кириллицу.", "https://github.com/google/fonts/tree/main/ofl/ysabeauinfant"],
"Risha Neo":["Isami Risha", "Свободный акцидентный шрифт, который автор сделал в Figma с помощью плагина Расмуса Андерссона для создания шрифтов. В версии 1.2 (февраль 2026) в него вошла доработка от пользователя He Rez AD: расширена кириллица для украинского, белорусского и молдавского и исправлен кернинг.", "https://github.com/isamirivers/Risha-Neo"],
"Shobhika":["Manish Khatri", "Шрифт деванагари для учёных, созданный в рамках инициативы SandHI Индийского технологического института в Мумбаи. Включает больше 1600 знаков деванагари с лигатурами-конъюнктами и ведическими ударениями; деванагари основана на шрифте Yashomudra, латиница — на PT Serif от ПараТайпа, есть и кириллица.", "https://github.com/Sandhi-IITBombay/Shobhika"],
"Swanston":["Liam Whitelaw", "Векторный шрифт, который подражает растровым терминальным шрифтам прошлого, но масштабируется на экранах высокой чёткости. Все знаки уложены в ячейку 8×16 пикселей, поэтому он встаёт туда, где раньше работали растровые шрифты; включает псевдографику кодовой страницы 437.", "https://github.com/lwhitelaw/Swanston"],
"Terminalia":["Стефан Пеев, 2025", "Проект вдохновлён Terminus — известным растровым шрифтом для терминалов — и стартовал с его версии 4.38, созданной Димитром Жековым в 2012 году.", "https://github.com/StefanPeev/Terminalia"],
"Theano Didot":["Алексей Крюков", "Алексей Крюков нарисовал шрифты Theano по историческим образцам: сначала как чисто греческие, а затем дополнил их латиницей в том же стиле, чтобы воспроизвести облик старых изданий античных текстов. Набор назван в честь Феано — древнегреческой женщины-философа, ученицы Пифагора, — как фигуры, связывающей античный и средневековый мир.", "https://github.com/akryukov/theano"],
"Theano Modern":["Алексей Крюков", "Алексей Крюков нарисовал шрифты Theano по историческим образцам: сначала как чисто греческие, а затем дополнил их латиницей в том же стиле, чтобы воспроизвести облик старых изданий античных текстов. Набор назван в честь Феано — древнегреческой женщины-философа, ученицы Пифагора, — как фигуры, связывающей античный и средневековый мир.", "https://github.com/akryukov/theano"],
"Theano Old Style":["Алексей Крюков", "Алексей Крюков нарисовал шрифты Theano по историческим образцам: сначала как чисто греческие, а затем дополнил их латиницей в том же стиле, чтобы воспроизвести облик старых изданий античных текстов. Набор назван в честь Феано — древнегреческой женщины-философа, ученицы Пифагора, — как фигуры, связывающей античный и средневековый мир.", "https://github.com/akryukov/theano"],
"Tihana":["Веско Радич", "Любительский проект, задуманный прежде всего как шрифт для комиксов.", "https://github.com/VeskoRadic/tihana-font"],
"TT2020 Base":["Fredrick Brennan, 2020", "Открытый «гиперреалистичный» многоязычный шрифт пишущей машинки. Версия 0.2 вышла в ноябре 2020 года.", "https://github.com/ctrlcctrlv/TT2020"],
"Vollda Bold":["Алексей Бурба", "Строгая антиква старого стиля на основе Vollkorn. Автор переделал слишком игривую «a» в духе Гранжона, осовременил кириллические К, Ж, Я, б и ф и убрал внутренние скругления в П, Д, Л, Ц, Ш, Щ — артефакт старой высокой печати.", "https://github.com/alexburba/vollda-typeface"],
"Walleye":["Nathanael Bonnell", "Оригинальная антиква для длинных текстов: длинные флажковые окончания и воздушные формы дают ей характер и светлую фактуру на странице. Многоязычная — латиница, политонический греческий и кириллица, капитель и развитые возможности для набора древнегреческого.", "https://github.com/chuckmasterson/walleye"],
"Xiaolai SC":["Nozomi Seto (Setofont), lxgw", "Китайский шрифт, выросший из Setofont японского дизайнера-любителя Нодзоми Сэто. Автор Xiaolai дополнил его недостающими упрощёнными иероглифами, собирая их из деталей оригинала. Первоначально проект назывался «Сяосэ» (Kose), но так как многие путали иероглиф, его переименовали в «Сяолай».", "https://github.com/lxgw/kose-font"],
"Кафизма (Cathisma)":["Влад Дорош, Александр Андреев", "Декоративный шрифт заголовков в богослужебных книгах Русской православной церкви, издававшихся с конца XIX века. Влад Дорош нарисовал его для проекта «Ирмологий», затем шрифт вошёл в пакет CSLTeX, а Александр Андреев перевёл его в Юникод в рамках Slavonic Computing Initiative.", "https://github.com/slavonic/Cathisma"],
"Оглавие (Oglavie)":["Влад Дорош, Александр Андреев", "Декоративный шрифт для заголовков в богослужебных книгах Русской православной церкви с конца XIX века. Создан Владом Дорошем для проекта «Ирмологий», позже вошёл в CSLTeX и был переведён в Юникод Александром Андреевым.", "https://github.com/slavonic/Oglavie"],
"Пономарь (Ponomar Unicode)":["Влад Дорош, Александр Андреев, Никита Симмонс", "Современный церковнославянский шрифт, воспроизводящий гарнитуру изданий Синодальной типографии начала XX века; им набирают богослужебные книги Московской патриархии. Начинался как Hirmos UCS Влада Дороша для проекта «Ирмологий», затем был переведён в Юникод и дополнен знаками для румынской кириллицы, алеутского и якутского.", "https://github.com/slavonic/Ponomar"],
"Мономах (Monomakh Unicode)":["Алексей Крюков, Александр Андреев, Никита Симмонс", "Кириллический шрифт в смешанном уставно-полууставном стиле для исследователей славянской истории и филологии, с латиницей в том же духе для многоязычных научных изданий. Вырос из шрифта Monomachus Алексея Крюкова, который долго не обновлялся и был продолжен Александром Андреевым и Никитой Симмонсом с новыми знаками Юникода.", "https://github.com/slavonic/Monomakh"],
"Droid 1997":["Рэй Лараби, 1997", "Идея пришла Лараби в торонтском трамвае: на вывеске магазина одежды он увидел узкие буквы в одном регистре. Из этого вырос униказный шрифт, где в каждой букве смешаны черты прописной и строчной.", "https://typodermicfonts.com/public-domain/"],
"Foo":["Рэй Лараби, 1996", "Появился, когда в одной из групп Usenet попросили сделать надпись для Foo Fighters «как на обложке Rolling Stone». Тогда автор не знал, что за этим образцом стоит Showcard Gothic — довольно новый шрифт Джима Паркинсона.", "https://typodermicfonts.com/public-domain/"],
"Mail Ray Stuff":["Рэй Лараби, 1999", "На шрифт повлиял стиль обложек пластинок группы Menudo 1980-х. Лараби стремился к органичным, непринуждённым и игривым формам букв.", "https://typodermicfonts.com/public-domain/"],
"Metal Lord":["Рэй Лараби, 1996", "Нарисован по логотипу Iron Maiden, в основе которого лежал более ранний шрифт, тогда автору неизвестный. Сначала в шрифте были только буквы из логотипа; позже, по мере того как фанаты находили новые материалы, Лараби дорисовал полный набор.", "https://typodermicfonts.com/public-domain/"],
"Neuropol":["Рэй Лараби, 1996", "Навеян шрифтом Digital Sans студии Brendel (1974), который Лараби любил с детства, ещё не зная его названия. Это не точное возрождение оригинала, а собственная вариация на его тему.", "https://typodermicfonts.com/public-domain/"],
"Propaniac":["Рэй Лараби, 2018", "Отправная точка — конверт сингла Pointer Sisters «Neutron Dance» (1984), оформленный лондонской студией Shoot That Tiger. Лараби не обводил надпись, а построил шрифт на тех же геометрических формах в стиле «Мемфис», что определяли вид обложки.", "https://typodermicfonts.com/public-domain/"],
"Renju":["Рэй Лараби, 2009", "Задуман как продолжение шрифта Gomoku, в котором были только прописные. В Renju появились строчные и фактура резинового штампа, сделанная в Photoshop.", "https://typodermicfonts.com/public-domain/"],
"Sexsmith":["Рэй Лараби, 1999", "Родился из экспериментов с рисованием шрифтов на карманном компьютере Palm Pilot, которые подтолкнули автора к формам, вряд ли возможным на бумаге. Брусковая антиква, свободно навеянная стилями конца XIX века.", "https://typodermicfonts.com/public-domain/"],
"Spectrashell":["Рэй Лараби, 2007", "Сделан для побочного проекта — выпуска обложки для паспорта. Угловатые, шестигранные буквы перекликаются с узором, похожим на панцирь, на самой обложке; автор рисовал их вручную в FontLab.", "https://typodermicfonts.com/public-domain/"],
"Zelega Zenega":["Рэй Лараби, 2018", "Название взято из ролевой игры Rogue Galaxy, в которую автор тогда играл. Модульный шрифт с преувеличенной шириной: буквы будто сложены из неровных блоков.", "https://typodermicfonts.com/public-domain/"],
"Bedstead":["Ben Harris", "«MODE 7 для XXI века»: шрифт построен на знаках микросхемы Mullard SAA5050, которая выводила телетекст и текст на экран компьютера BBC Micro. Пиксельную сетку 5×9 автор превратил в контурный шрифт с гладкими диагоналями; сами контуры генерирует программа на C, а знаки мозаичной телетекстовой графики тоже включены.", "https://bjh21.me.uk/bedstead/"],
"Fette Bauersche Antiqua":["Peter Wiegel, 2012", "Цифровое возрождение жирной антиквы, которую словолитня Бауэра впервые отлила в 1850 году под общим названием Fette Antiqua. Вигель добавил кириллицу и греческий, а также оттеночный и контурный варианты; в деталях, например в строчной «a», шрифт отличается от оригинала.", "https://fontsinuse.com/typefaces/40261/fette-bauersche-antiqua"],
"CAT Hohenzollern":["Peter Wiegel, 2014", "Цифровая версия шрифта Hohenzollern, который Карл Альберт Фаренвальдт нарисовал в 1902 году для словолитни Бауэра. Фаренвальдт — немецкий литограф и график из Штутгарта; Вигель оцифровал несколько его работ.", "https://luc.devroye.org/fonts-26308.html"],
"Vis-A-Vis":["Peter Wiegel", "Шрифт с засечками только из прописных, у которого буквы как бы разрезаны посередине — получается двухэтажная конструкция. Автор — немецкий дизайнер из Вольгаста, известный цифровыми версиями исторических немецких шрифтов.", "https://luc.devroye.org/fonts-47415.html"],
"Helvetia Verbundene":["Peter Wiegel, 2010", "Связный школьный рукописный шрифт, сделанный по прописи 1901 года, которую создал немецкий литограф и график Карл Альберт Фаренвальдт.", "https://luc.devroye.org/fonts-26308.html"],
"Miama Nueva":["Linus Romer, 2016", "Каллиграфический рукописный шрифт Линуса Ромера, выпущенный в архиве CTAN вместе с поддержкой LaTeX. Содержит больше 1300 знаков: латиницу, кириллицу и греческий.", "https://ctan.org/pkg/miama"],
"Luculent":["Andrew Kensler", "Семейство моноширинных шрифтов для программирования из четырёх начертаний. В версии 2.0 (2015) автор добавил 232 знака до полного набора Adobe Latin 3 и доработал многие существующие буквы.", "https://dcmpx.remotevs.com/com/eastfarthing/PL/blog/2015-10-16-luculent"],
"Kelvinch":["Paul Miller", "Антиква для основного текста, задуманная так, чтобы её было комфортно читать в длинных материалах и при этом приятно разглядывать. Кириллица включает сербские формы.", "https://localfonts.eu/?p=29618"],
"Selena":["Стефан Пеев (Context Ltd), 2014", "Свободный гротеск с латиницей и кириллицей от болгарской студии Context из Пловдива. Стефан Пеев выпустил его через Open Font Library; позже вышла обновлённая версия 2015 года.", "https://luc.devroye.org/fonts-77041.html"],
"Lorenzo Sans":["Intel, 2017", "Слегка изменённая версия Clear Sans — шрифта, который Intel сделала вместе с Monotype в 2013 году для чтения с экрана.", "https://luc.devroye.org/fonts-73339.html"],
"Zapus Sans":["Belleve Invis, 2019", "Шрифт на основе Iosevka Aile, сделанного тем же автором. Он «полумоноширинный»: ширина букв зафиксирована лишь частично.", "https://luc.devroye.org/fonts-82704.html"],
"Xolonium":["Severin Meyer, 2011", "Квадратный футуристический шрифт в стиле «техно» от швейцарского автора, выпущенный через Open Font Library и обновлённый в 2016 году. Поддерживает латиницу, греческий и кириллицу.", "https://luc.devroye.org/fonts-64710.html"],
"TT2020 Style E":["Fredrick Brennan, 2020", "Один из стилей TT2020 — открытого «гиперреалистичного» многоязычного шрифта пишущей машинки. Версия 0.2 семейства вышла в ноябре 2020 года.", "https://github.com/ctrlcctrlv/TT2020"],
"Fascinate":["Astigmatic (AOETI), кириллица — Денис Игнатов", "Поклон ар-деко и шрифтам вроде Broadway, но с увеличенной высотой строчных и мягкостью, которые делают его дружелюбным. Несмотря на высокий контраст, хорошо читается даже в небольших размерах. Кириллическую версию сделал Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/fascinate"],
"Jolly Lodger":["Stuart Sandler (Font Diner), кириллица — Денис Игнатов", "Шрифт Стюарта Сэндлера из Font Diner в духе американской середины XX века: авторское описание обыгрывает образ уютного придорожного мотеля у шоссе с кондиционером и кабельным телевидением. Кириллицу дорисовал Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/jollylodger"],
"Rum Raisin":["Astigmatic (Brian J. Bonislawsky), кириллица — Денис Игнатов", "Вдохновлён надписью на старой коробке хлопьев Kellogg's Raisin Bran. Исходно это был шрифт в одном регистре, а затем его развили до полноценных прописных и строчных; униказная «a» сохранена как альтернативный знак. Кириллица — Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/rumraisin"],
"Gochi Hand Cyrillic":["Juan Pablo del Peral (Huerta Tipográfica), кириллица — Денис Игнатов", "Шрифтовая интерпретация почерка подростка — не каллиграфа, а обычного человека. Строка выглядит спонтанной, но цельной, хорошо читается на экране даже мелко и аккуратно смотрится в печати. Кириллическую версию сделал Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/gochihand"],
"Passero One Cyrillic":["Viktoriya Grabowska (Sorkin Type), кириллица — Денис Игнатов", "Малоконтрастный гротеск с очень своеобразным голосом, который остаётся удивительно читаемым — возможно, потому что мягко перекликается с формами старинных текстовых шрифтов. Лучше всего работает от средних текстовых до крупных заголовочных размеров. Кириллица — Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/passeroone"],
"Swanky and Moo Moo":["Kimberly Geswein, кириллица — Денис Игнатов", "Рукописный шрифт по почерку молодой мамы, который автору понравился необычными буквами и характером. Название составлено из семейных прозвищ. Кириллицу дорисовал Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/swankyandmoomoo"],
"Caesar Dressing Cyrillic":["Dathan Boardman (Open Window), кириллица — Денис Игнатов", "Взгляд на греческий алфавит через рисунок маркером: студия Open Window любит экспериментальные и спонтанные формы, но здесь сохранено геометрическое равновесие классического «греческого» шрифта. Кириллицу сделал Денис Игнатов.", "https://github.com/google/fonts/tree/main/ofl/caesardressing"],
"Pecita":["Philippe Cochy", "Рукописный шрифт, задуманный как максимально естественная имитация живого почерка. Этого автор добивается возможностями OpenType — контекстными вариантами букв, лигатурами и случайной заменой форм; шрифт целиком сделан в Linux и FontForge.", "https://fedoraproject.org/wiki/Pecita_font"],
"Крамола (Kramola)":["Алексей Меднов, 2015", "Акцидентный шрифт с латиницей и кириллицей, вдохновлённый старославянскими надписями. Предназначен для заголовков и крупного набора.", "https://luc.devroye.org/fonts-81942.html"],
"Wes":["Елена Мадянкина, Jovanny Lemonad", "Шрифт, задуманный специально для оформления в духе фильмов Уэса Андерсона — титров и киноафиш.", "https://localfonts.eu/?p=1734"],
"Znikomit":["Grzegorz Luksza (gluk), 2011", "Работа польского дизайнера, который специализируется на подчёркнуто декоративных и экспериментальных шрифтах. Znikomit — брусковый шрифт с волосными штрихами и каплевидными элементами.", "https://luc.devroye.org/fonts-48683.html"],

"HG2G":["Дмитрий Здоров", "Русифицированный шрифт по рукописному заглавию с оригинальной обложки «Автостопом по Галактике» — чтобы название книги можно было написать по-русски в том же стиле.", "https://dimka.com/fonts/free-fonts"],
"Зарровв (Xarrovv)":["Дмитрий Здоров", "Шрифт, похожий на почерк очень аккуратного человека. Отличается огромным охватом: расширенная латиница, кириллица с вариантами для русского, болгарского и сербского, греческий, грузинский, армянский, иврит, тайский и больше 3000 иероглифов.", "https://dimka.com/fonts/free-fonts"],
"Wimzik":["Дмитрий Здоров", "Игривый рукописный шрифт с причудливым характером. Кроме латиницы и кириллицы, в нём есть греческий и грузинский.", "https://dimka.com/fonts/free-fonts"],

"Tilda Sans":["ПараТайп для Tilda Publishing, 2021", "Фирменный шрифт конструктора сайтов Tilda, выпущенный под открытой лицензией, чтобы все пользователи платформы могли бесплатно применять его и в коммерческих проектах. Семь насыщенностей — от Light до Black — собраны в один вариативный файл, чтобы страницы грузились быстрее.", "https://blog-en.tilda.cc/tpost/luj520jnb1-tilda-sans-typeface"],
"Monoid 2.0":["Andreas Larsen, 2015", "Открытый шрифт для программирования, построенный на трёх принципах: читаемость, компактность и красота. Плотная разбивка позволяет уместить на экране больше кода, а похожие знаки — R и B, ноль и O — сознательно сделаны легко различимыми, чтобы проще искать ошибки.", "https://www.fastcompany.com/3048939/do-you-code-you-should-try-this-font"],
"Classic Console Neue":["DeeJayy", "Растровый шрифт 8×16 пикселей в духе VGA-шрифта DOS. Автор сверял знаки с таблицами кодовых страниц DOS и дорисовывал недостающие символы, в том числе буквы с диакритикой, в стиле оригинального шрифта видеокарты VGA.", "https://hn.jakechampion.name/item/40590910"],
"Сёнэн (Shonen)":["Намик Мардахаев (Намикус), 2025", "Бесплатный шрифт для комиксов, выпущенный в ноябре 2025 года. Автор описывает его характер как спокойный и уверенный, но жаждущий приключений; поддерживает расширенную кириллицу и латиницу.", "https://teletype.in/@namikus/zFHA7ov7BAH"],
"Triod Postnaja":["Daniel Johnson", "Шрифт по мотивам гарнитур, которыми до XX века печатали церковнославянские богослужебные книги, с латиницей в том же духе. Необычна именно латиница: строчные с выносными элементами подражают унциальному письму. В описании пакета шрифт честно называют стилистической смесью разных эпох, а для строгого церковнославянского набора советуют Hirmos Ponomar.", "https://packages-pkgmirror-csail.debian.org/ru/sid/fonts-triod-postnaja"],
'PT Sans':['ПараТайп, 2009','Сделан для проекта «Общедоступные шрифты народов России» к 300-летию гражданского шрифта Петра I. Задача — дать всем народам России возможность читать и писать на родных языках, поэтому в шрифте есть знаки всех титульных языков страны. Опирается на советские гротески второй половины XX века.'],
'PT Serif':['ПараТайп, 2010','Вторая семья проекта «Общедоступные шрифты народов России», парная к PT Sans. Переходная антиква с гуманистическими окончаниями: спокойная для текста и узнаваемая в заголовках.'],
'PT Mono':['ПараТайп, Александра Королькова','Моноширинная пара к PT Sans и PT Serif. Создавался для форм, таблиц и анкет, особенно на государственных сайтах: при равной ширине знаков легко рассчитать поля и колонки.'],
'Literata':['TypeTogether','Появилась как фирменный шрифт Google Play Книг, а в третьей версии стала вариативной семьёй для любого экрана. Кириллицу рисовали Вера Евстафьева и Елена Новосёлова; шрифт получил премию Modern Cyrillic 2021.'],
'JetBrains Mono':['JetBrains, Филипп Нуруллин и Константин Буленков','Моноширинный шрифт, сделанный под нужды программистов компанией — автором сред разработки: высокие строчные, различимые похожие знаки, лигатуры для кода.'],
'Inter':['Расмус Андерссон','Вариативный шрифт, задуманный специально для экранов: высокие строчные, контекстная пунктуация, ноль с чертой и табличные цифры.'],
'Golos Text':['ПараТайп, 2019','Заказан для сайтов государственных и социальных сервисов. Авторы — Александра Королькова и Виталий Кузьмин. Версия Text рассчитана на долгое чтение с экрана.'],
'Manrope':['Михаил Шаранда, 2018','Современный открытый гротеск. В 2019 году вместе с Мирко Велимировичем стал вариативным.'],
'Lora':['Cyreal','Антиква с каллиграфическими корнями и умеренным контрастом: мягкие кисти в изгибах и упругие засечки. Рассчитана на текст, хорошо выглядит и на экране, и в печати.'],
'Playfair Display':['Клаус Эггерс Сёренсен, 2011','Переходная антиква для крупных размеров. Отсылает к эпохе Просвещения, когда стальное перо и новая печать дали тонкие волосяные штрихи, — к Баскервилю и «шотландским» антиквам, но не копирует их.'],
'Oswald':['Вернон Адамс, 2011','Переработка классических узких гротесков Alternate Gothic, перерисованная под пиксельную сетку экранов. Автор развивал шрифт до 2014 года, позже его доделывали другие дизайнеры.'],
'Raleway':['Мэтт Макинерни; Пабло Импаллари и Родриго Фуэнсалида','Сначала был одним тонким начертанием, в 2012 году вырос до девяти. Акцидентный гротеск с элегантным характером и старостильными цифрами.'],
'Jost':['Оуэн Эрл, indestructible type*','Вдохновлён немецкими геометрическими гротесками 1920-х. В 2020 году стал вариативным.'],
'EB Garamond':['Георг Дуффнер, общественный проект','Возрождение гарамонов XVI века по образцу 1592 года из типографии Эгенольфа (отсюда буквы EB — Egenolff-Berner). Гарамон — один из ключевых шрифтов в истории книги.'],
'Old Standard TT':['Алексей Крюков','Воспроизводит антикву, которой набирали книги конца XIX — начала XX века, — прямо противопоставлена советской «Обыкновенной новой». Хорошо передаёт атмосферу старой научной книги.'],
'Alegreya':['Хуан Пабло дель Пераль, Huerta Tipográfica','Шрифт для литературы с живым каллиграфическим ритмом. В 2011 году вошёл в число «шрифтов десятилетия» конкурса ATypI Letter2.'],
'Fira Sans':['Carrois, Эрик Шпикерман','Сделан для мобильной системы Mozilla Firefox OS: должен был хорошо читаться на телефонах с разными экранами. Есть три ширины и моноширинный вариант.'],
'Open Sans':['Стив Маттесон, Ascender','Гуманистический гротеск с открытыми формами и нейтральным, дружелюбным характером, рассчитанный на печать, веб и мобильные интерфейсы.'],
'Merriweather':['Sorkin Type','Антиква для чтения с экрана: очень высокие строчные, слегка сжатые пропорции, крепкие засечки. Есть парный гротеск Merriweather Sans.'],
'Cormorant':['Кристиан Тальман, Catharsis Fonts','Акцидентная семья, вдохновлённая наследием Клода Гарамона, но нарисованная с нуля. Девять стилей, от прямого и курсива до «младенческого» Infant и Unicase.'],
'Roboto':['Кристиан Робертсон, Google','Шрифт «двойной природы»: механический каркас и дружелюбные открытые изгибы. Стал системным шрифтом Android и одной из самых распространённых гарнитур в мире.'],
'Roboto Flex':['Font Bureau для Google','Переосмысление Roboto с огромным диапазоном осей: вес, ширина, оптический размер и тонкие параметрические настройки.'],
'IBM Plex Sans':['Майк Эббинк (IBM) и Bold Monday','Фирменная семья IBM, которая выражает отношения человека и машины. Существует в вариантах Sans, Serif и Mono, которые хорошо сочетаются.'],
'Source Serif 4':['Франк Грисхаммер, Adobe','Переходная антиква, пара к Source Sans. Свободно опирается на работы Пьера Симона Фурнье XVIII века и сохраняет его характерные детали.'],
'Source Code Pro':['Пол Хант, Adobe','Моноширинная версия Source Sans для кода с теми же пропорциями.'],
'Unbounded':['Studio Koto и NaN для Polkadot','Пожалуй, первый открытый шрифт, профинансированный из блокчейн-казны. Восемь широких акцидентных начертаний, латиница и кириллица, своя система цифр.'],
'Bitter':['Соль Матас','Брусковая антиква для чтения с экрана, выросшая из строгости пиксельной сетки: крупные строчные и почти ровный штрих.'],
'Brygada 1918':['Возрождение к 100-летию независимости Польши','Восстановлена по каталогу Национальной словолитни 1954 года и матрицам, найденным в музее книжного искусства в 2016 году.'],
'Caveat':['Пабло Импаллари','Рукописный шрифт для заметок и текста: буквы слегка меняются в зависимости от места в слове. Расширенную кириллицу сделала московская словолитня Cyreal.'],
'Lato':['Лукаш Дзедзиц, 2010','«Лето» по-польски. Задумывался для фирменного стиля клиента, а когда тот выбрал другое направление, был опубликован свободно. Автор описывал его как «серьёзный, но дружелюбный, с ощущением лета».'],
'Exo 2':['Натанаэль Гама','Полная перерисовка геометрического Exo с технологичным, футуристическим характером. Вторая версия органичнее и лучше читается в мелком тексте.'],
'Arsenal':['Андрей Шевченко, 2011','Победитель украинского конкурса шрифтового дизайна «Мистецький Арсенал». Полугротеск с традиционными формами и узкими пропорциями для экономного набора.'],
'Days One':['Александр Калачёв, Иван Гладких, Алексей Маслов, 2008','Экспериментальный широкий шрифт с толстым штрихом — для заголовков.'],
'Prata':['Иван Петров, Cyreal','Элегантная дидона с острыми засечками и каплевидными окончаниями. Контраст высокий, поэтому лучше работает крупно.'],
'Podkova':['Илья Юдин, 2010; Алексей Ванягин','«Подкова» — монолинейная брусковая антиква с диагональными окончаниями. Широкие пропорции помогают в мелком размере, необычные формы — в заголовках.'],
'Ruslan Display':['Денис Машаров по шрифту Олега Снарского','Основан на шрифте 1970-х, который отсылает к уставу и полууставу XI–XVI веков; его можно увидеть на станции киевского метро «Теремки». Оцифрован в 2011 году.'],
'Monomakh':['Проект Slavonic','Кириллица в смешанном стиле устава и полуустава для исследователей славянской истории и филологии.'],
'Ponomar':['Проект Slavonic','Церковнославянский шрифт по образцу изданий Синодальной типографии начала XX века. Им до сих пор набирают богослужебные книги.'],
'Triodion':['Проект Slavonic','Воспроизводит шрифт церковных книг Петербурга и Москвы конца XIX — начала XX века.'],
'Pochaevsk':['Проект Slavonic','Повторяет шрифт изданий Почаевской лавры конца XIX века. Низкие вертикальные метрики удобны для двуязычных изданий.'],
'Shafarik':['Проект Slavonic','Назван в честь Павла Йозефа Шафарика, одного из основателей славянской филологии. Нужен для научной публикации старославянских текстов кириллицей и глаголицей.'],
'Underdog':['Сергей Стеблина, Jovanny Lemonad','Неформальный шрифт с «рваными» углами, вдохновлённый уличными самодельными вывесками и музыкальным леттерингом. Меняет настроение в зависимости от контекста.'],
'Handjet':['Давид Бржезина, Rosetta','Модульный вариативный шрифт: каждый знак собран из одинаковых элементов, которые плавно превращаются в одну из 23 форм.'],
'Vollkorn':['Фридрих Альтхаузен, 2005','Первая работа автора. Название по-немецки значит «цельнозерновой» и отсылает к старому термину «хлебный шрифт» — так называли шрифты для каждодневного набора.'],
'Yanone Kaffeesatz':['Yanone, 2004','Жирное начертание напоминает типографику кофеен 1920-х. Первый законченный шрифт автора, ставший очень популярным на упаковке и в кафе по всему миру.'],
'Press Start 2P':['Коди Бойслер','Пиксельный шрифт по мотивам аркадных игр Namco 1980-х. Лучше всего выглядит в размерах, кратных 8 пикселям.'],
'Sofia Sans':['Lettersoup','Задумывался как шрифт столицы Болгарии. Вдохновлён «техническими» гротесками начала XX века, четыре ширины.'],
'Ysabeau':['Кристиан Тальман, Catharsis Fonts','Соединяет гарамоновские пропорции и выносные элементы с чистотой малоконтрастного гротеска — для долгого чтения.'],
'Oranienbaum':['Олег Поспелов, Jovanny Lemonad','Контрастная антиква в духе Бодони и шрифтов первой четверти XX века: выраженные засечки, игра прямых углов и плавных линий.'],
'Kelly Slab':['','Геометрическая брусковая антиква под влиянием шрифтов 1930-х, например City Георга Трумпа. Для рекламы, заголовков и логотипов.'],
'Pacifico':['Вернон Адамс, 2011','Кистевой рукописный шрифт, вдохновлённый сёрф-культурой Америки 1950-х. Кириллицу в 2017 году добавила студия Lettersoup.'],
'Mulish':['Вернон Адамс, 2011–2014','Минималистичный гротеск. После смерти автора работу завершил Жак Ле Байи.'],
'Piazzolla':['Хуан Пабло дель Пераль, HT Fonts','Компактная система для прессы: позволяет мелкий кегль и плотный интерлиньяж без потери читаемости.'],
'Yomogi':['Сацуяко','Японский рукописный шрифт, похожий на надпись тонким карандашом: живой, чуть неровный штрих. Сделан сначала для японского, позже в него добавили кириллицу — поэтому русские буквы тут выглядят как дружелюбная записка от руки.'],'Neucha':['','Автор пишет, что придумал шрифт ради одной фразы — «Я тебя люблю» — в 2005 году, а первая версия заняла восемь часов. Название шутливо расшифровывает как «не умеющий делать шрифты правильно».'],
'Philosopher':['Jovanny Lemonad, 2008','Вдохновлён Agfa Rotis и ITC Binary. Автор признаётся, что первую версию специально выпустил с ошибками, чтобы расшевелить дизайнеров.'],
'Russo One':['Jovanny Lemonad','Шрифт для заголовков и логотипов. Автор хотел показать, что русская культура разнообразна и современна, — «без снега, водки и медведей».'],
'Stalinist One':['Алексей Маслов и Jovanny Lemonad','Задуман как шрифт для постапокалиптического мира: простой, утилитарный и сильный.'],
'Martian Mono':['Evil Martians','Моноширинная версия Martian Grotesk с брутальной эстетикой. Вариативный по весу и ширине, кириллица добавлена в 2023 году.'],
'STIX Two Text':['Консорциум научных издательств','Шрифты STIX создавались для научных, медицинских и технических публикаций по инициативе AMS, AIP, APS, ACS, IEEE и Elsevier.'],

const FN={'c:Гротеск':'гротески','c:Антиква':'антиквы','c:Акцидентный':'акцидентные','c:Моно':'моноширинные','c:Рукописный':'рукописные',vf:'вариативные',family:'большие семьи',single:'одиночки с характером',it:'с курсивом',heavy:'плотные, жирные',light:'тонкие',fresh:'необычные',std:'проверенная классика'};
function feats(f){const o={['c:'+f[1]]:1};if(f[2]&&f[3]<f[4])o.vf=1;if(f[5]>=6)o.family=1;else if(f[5]<=2)o.single=1;if(f[6])o.it=1;if(f[4]>=800)o.heavy=1;if(f[3]<=200)o.light=1;o[isStd(f)?'std':'fresh']=1;return o}
let SW=lsGet('pada_swipe',{seen:{},w:{},n:0});let swCur=null,swNextF=null;
const swScore=f=>{let s=0;for(const k in feats(f))s+=SW.w[k]||0;return s};
function swPick(skip){const pool=FONTS.filter(f=>!(f[0] in SW.seen)&&f!==skip);if(!pool.length)return null;const n=SW.n;const fresh=pool.filter(f=>!isStd(f));
 if(n<7){const order=['Акцидентный','Антиква','Гротеск','Рукописный','Акцидентный','Моно','Антиква'];const p=fresh.filter(f=>f[1]===order[n]);return R(p.length?p:fresh.length?fresh:pool)}
 if(Math.random()<.22)return R(fresh.length?fresh:pool);
 return pool.map(f=>[f,swScore(f)+(isStd(f)?-1.5:0)+Math.random()*1.2]).sort((a,b)=>b[1]-a[1])[0][0]}

 app.innerHTML=`<div class="wrap sw2"><div>

  <div style="font-size:13px;color:var(--mut);margin-top:12px">Карточку можно смахнуть мышкой или пальцем. «Нравится» сразу кладёт шрифт в Бортовой журнал.</div></div>
  <div class="taste" id="taste"></div></div>`;
 swCur=swPick();swNextF=swPick(swCur);swDraw();swTaste();

function swCard(f,back){const d=document.createElement('div');d.className='swc tile'+(back?' back':'');d.innerHTML='<div class="art"></div><div class="stamp y">НРАВИТСЯ</div><div class="stamp n">НЕ МОЁ</div>';const pi=Math.floor(Math.random()*PAL.length),tp='specimen';loadFont(f).then(()=>compose(d,f,tp,pi)).catch(()=>{});return d}
function swDraw(){const st=$('#swst');if(!st)return;st.innerHTML='';if(!swCur){st.innerHTML='<div class="empty">Ты оценил все шрифты базы</div>';return}
 if(swNextF)st.appendChild(swCard(swNextF,true));const c=swCard(swCur,false);st.appendChild(c);
 $('#swn').textContent=swCur[0];$('#swl').href='#/font/'+slug(swCur[0]);
 let x0=null,dx=0;c.onpointerdown=e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};
 c.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;c.querySelector('.stamp.y').style.opacity=Math.max(0,dx/120);c.querySelector('.stamp.n').style.opacity=Math.max(0,-dx/120)};
 c.onpointerup=()=>{if(x0==null)return;x0=null;c.style.transition='';if(Math.abs(dx)>110)swVote(dx>0?1:-1);else{c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}dx=0}}
let swBusy=false;function swVote(v){if(!swCur||swBusy)return;swBusy=true;const f=swCur;const c=document.querySelector('.swc:not(.back)');
 if(v!==0){SW.seen[f[0]]=v;SW.n++;const fs=feats(f);for(const k in fs)SW.w[k]=(SW.w[k]||0)+v*(k.startsWith('c:')?1:.6);if(v>0&&!isFav(f[0]))toggleFav(f[0])}
 lsSet('pada_swipe',SW);
 if(c){c.style.transform=v===0?'translateY(-40px) scale(.9)':`translateX(${v*140}%) rotate(${v*24}deg)`;c.style.opacity=0;if(v)c.querySelector('.stamp.'+(v>0?'y':'n')).style.opacity=1}
 setTimeout(()=>{swCur=swNextF||swPick();swNextF=swPick(swCur);swDraw();swTaste();const m=document.querySelector('.mono');if(m)m.textContent=`★ СВАЙП ШРИФТОВ · ${Object.keys(SW.seen).length} ОЦЕНЕНО`;swBusy=false},300)}
function swTaste(){const el=$('#taste');if(!el)return;const n=Object.keys(SW.seen).length;
 if(n<5){el.innerHTML=`<h2>Собираю твой вкус</h2><p style="color:var(--mut);margin:6px 0 18px">Оцени ещё ${5-n} ${plural2(5-n)}: первые карточки специально разные, чтобы понять, что тебе ближе.</p><div style="display:flex;gap:6px">${[0,1,2,3,4].map(i=>`<i style="flex:1;height:6px;border-radius:9px;background:${i<n?'var(--ink)':'var(--soft)'}"></i>`).join('')}</div>`;return}
 const ent=Object.entries(SW.w).filter(([k,v])=>FN[k]&&Math.abs(v)>=.5).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...ent.map(e=>Math.abs(e[1])));
 const likes=ent.filter(e=>e[1]>0).slice(0,3).map(e=>FN[e[0]]),dis=ent.filter(e=>e[1]<0).slice(-2).map(e=>FN[e[0]]);
 const best=FONTS.filter(f=>SW.seen[f[0]]!==-1).map(f=>[f,swScore(f)+(SW.seen[f[0]]===1?.4:0)]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
 el.innerHTML=`<div class="mono" style="font-size:11px;color:var(--mut)">ТВОЙ ВКУС · ${n} ОЦЕНОК</div><h2 style="margin-top:8px">${likes.length?'Тебе ближе '+esc(likes.join(', ')):'Пока без явных предпочтений'}</h2>${dis.length?`<p style="color:var(--mut);margin:4px 0 14px">Не заходят: ${esc(dis.join(', '))}</p>`:'<div style="height:14px"></div>'}
 ${ent.slice(0,8).map(([k,v])=>`<div class="tbar"><span>${FN[k]}</span><i><b style="${v>=0?'':'left:auto;right:50%;'}width:${Math.abs(v)/mx*50}%;background:${v>=0?'var(--ok)':'#B23A2E'}"></b></i><span class="mono" style="font-size:11px;color:var(--mut)">${v>0?'+':''}${v.toFixed(1)}</span></div>`).join('')}
 <div class="sh" style="margin-top:22px"><h2 style="font-size:22px"><span>✦</span>Лучшее совпадение</h2><button class="pill soft" type="button" id="swr">Начать заново</button></div>
 <div class="match">${best.map((f,i)=>`<a href="#/font/${slug(f[0])}"><div class="tile" data-m="${i}"><div class="art"></div></div><span>${esc(f[0])}${SW.seen[f[0]]===1?' ♥':''}</span></a>`).join('')}</div>`;
 best.forEach((f,i)=>loadFont(f).then(()=>compose(document.querySelector(`[data-m="${i}"]`),f,R(['glyph','index','plaque']),Math.floor(Math.random()*PAL.length))).catch(()=>{}));
 $('#swr').onclick=()=>{swBusy=false;SW={seen:{},w:{},n:0};lsSet('pada_swipe',SW);swipe()}}
