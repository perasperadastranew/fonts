<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Библиотека шрифтов Perasperadastra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--ink:#0C0B0D;--pap:#F1EFEA;--wh:#FFFFFF;--mut:#6E6A66;--ln:rgba(12,11,13,.12);--soft:rgba(12,11,13,.06);--ok:#DFF3E4}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--pap);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.wrap{max-width:1376px;margin:0 auto;padding:0 32px}
/* шапка */
.hd{position:sticky;top:0;z-index:20;background:var(--hdbg,rgba(241,239,234,.92));backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{font-weight:600;letter-spacing:1.8px;font-size:13px;white-space:nowrap}
.logo span{font-family:'JetBrains Mono',monospace;font-weight:400;letter-spacing:.4px;color:var(--mut);margin-left:6px}
.nav{display:flex;gap:2px}
.nav a,.pill{padding:9px 14px;border-radius:999px;font-size:14px;white-space:nowrap;border:0;background:transparent}
.nav a:hover,.pill:hover{background:var(--soft)}
.nav a.on{background:var(--soft)}
.pill.soft{background:var(--soft)}.pill.soft:hover{background:rgba(12,11,13,.1)}
.pill.dark{background:var(--ink);color:var(--pap);font-weight:500}.pill.dark:hover{background:#2a272b}
.hr{display:flex;gap:6px;align-items:center}
.icon{width:40px;height:40px;border-radius:999px;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center}
/* общая фраза */
.phr{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--ln)}
.phr label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.5px;color:var(--mut);white-space:nowrap}
.phr input{flex:1;border:0;background:transparent;font:22px 'Golos Text';color:var(--ink);outline:none;min-width:0}
.sz{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
input[type=range]{accent-color:var(--ink)}
/* каталог */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:8px;margin:24px 0 8px}
.tile{position:relative;container-type:size;overflow:hidden;border-radius:calc(var(--rk,1)*24px)}
.tile .art{position:absolute;inset:0;overflow:hidden}
.intro{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.intro h1{margin:0;font-weight:400;font-size:52px;line-height:.98;letter-spacing:-2px}
.intro p{margin:0;font-size:16px;line-height:1.55;color:var(--mut)}
.cfp{display:grid;grid-template-columns:236px minmax(0,1fr);gap:36px;align-items:start;padding-top:24px}
.cside{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:none}
.cside::-webkit-scrollbar{display:none}
.cside .box{background:var(--ink);color:var(--pap);border-radius:calc(var(--rk,1)*22px);padding:18px 20px}
.cside .box b{display:block;font-size:40px;font-weight:400;letter-spacing:-1.5px;line-height:1}
.cside .box small{color:#A5A09B;font-size:12px}
.cside .box .bar{height:3px;border-radius:3px;background:rgba(241,239,234,.15);margin-top:12px;overflow:hidden}.cside .box .bar i{display:block;height:100%;background:#FF7122;transition:width .4s}
.cside h4{font:10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;color:var(--mut);margin:6px 12px 2px;font-weight:400}
.cnav{display:flex;flex-direction:column;font-size:15px}
.cnav a,.cnav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:calc(var(--rk,1)*12px);transition:background .2s}
.cnav a:hover,.cnav button:hover{background:rgba(12,11,13,.05)}
.cnav .on{background:var(--wh)}
.cnav span{font:11px 'JetBrains Mono',ui-monospace,monospace;color:var(--mut)}
.cnav i{margin-left:auto;font:normal 11px 'JetBrains Mono',ui-monospace,monospace;color:var(--mut)}
.cnav .dot{width:8px;height:8px;border-radius:50%;align-self:center;flex:none}
.cnav .tg::before{content:'';width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;align-self:center;flex:none;opacity:.5}
.cnav .tg.on::before{background:#FF7122;border-color:#FF7122;opacity:1}
@media(max-width:900px){.cfp{grid-template-columns:1fr;gap:0}.cside{position:sticky;top:56px;z-index:5;max-height:none;flex-direction:row;overflow-x:auto;background:var(--pap);padding:8px 0;gap:4px}.cside .box,.cside h4,.cside .cnav.sec2{display:none}.cnav{flex-direction:row;gap:4px}.cnav a,.cnav button{white-space:nowrap;background:var(--wh);padding:7px 12px}}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:20px 0 12px}
.chip{padding:9px 14px;border-radius:999px;border:0;background:var(--soft);font-size:14px}
.chip i{font-style:normal;color:var(--mut);margin-left:4px;font-size:12px}
.chip.on{background:var(--ink);color:var(--pap)}.chip.on i{color:#A5A09B}
.sel{padding:9px 14px;border-radius:999px;border:0;background:var(--soft);font:14px 'Golos Text';color:var(--ink)}
.search{flex:0 1 240px;padding:9px 16px;border-radius:999px;border:0;background:var(--soft);font:14px 'Golos Text';color:var(--ink);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;padding:8px 0 64px}
.card{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px;min-height:240px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .pv{font-size:var(--csz,40px);line-height:1.08;overflow-wrap:anywhere;opacity:0;transition:opacity .3s;flex:1}
.card .pv.ld{opacity:1}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--ln);padding-top:12px;font-size:14px}
.card .ft small{color:var(--mut);font-size:12px}
.star{border:0;background:transparent;font-size:18px;padding:2px 6px;border-radius:999px;line-height:1}
.star.on{color:#E8402B}
.empty{padding:80px 0;text-align:center;color:var(--mut)}
/* страница шрифта */
.cover{position:relative;height:min(72vh,660px);min-height:440px;container-type:size;overflow:hidden;border-radius:calc(var(--rk,1)*24px);margin-bottom:28px}
.cover .art{position:absolute;inset:0}
.cover .art [style*="right:3cqw;bottom:3cqw"]{display:none}
.cover .ov{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;z-index:2}
.cover .nm{background:rgba(241,239,234,.94);backdrop-filter:blur(10px);border-radius:calc(var(--rk,1)*20px);padding:14px 18px}
.cover .nm h1{margin:0;font-weight:400;font-size:40px;line-height:1;letter-spacing:-1px}
.cover .nm div{font-size:12px;color:var(--mut);margin-top:6px}
.cover .act{display:flex;gap:6px;background:rgba(241,239,234,.94);backdrop-filter:blur(10px);border-radius:999px;padding:6px}
.fp{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding:32px 0 64px;align-items:start}
.side{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
.side .box{background:var(--ink);color:var(--pap);border-radius:calc(var(--rk,1)*22px);padding:20px;display:flex;flex-direction:column;gap:12px}
.side .box .n{font-size:26px;line-height:1.05;letter-spacing:-.5px}
.side .box small{color:#A5A09B;font-size:12px}
.side .box .lic{color:#9FE0B0;font-size:12px}
.side .box .pill{text-align:center}
.side .box .pill.lt{background:var(--pap);color:var(--ink);font-weight:500}
.toc{display:flex;flex-direction:column;font-size:15px}
.toc a{display:flex;gap:12px;padding:8px 12px;border-radius:calc(var(--rk,1)*12px)}
.toc a span{font:11px 'JetBrains Mono';color:var(--mut);padding-top:3px}
.toc a.on{background:var(--wh)}
.sec{padding-bottom:72px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
.sh h2{margin:0;font-weight:400;font-size:34px;letter-spacing:-1px;line-height:1.05}
.sh h2 span{font:12px 'JetBrains Mono';letter-spacing:.5px;color:var(--mut);vertical-align:top;margin-right:10px}
.sh small{font:11px 'JetBrains Mono';letter-spacing:.5px;color:var(--mut)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:7px 12px;border-radius:999px;font-size:13px;background:var(--soft)}
.tag.ok{background:var(--ok)}
.two{display:grid;grid-template-columns:7fr 5fr;gap:32px}
.typing{display:inline-block;overflow:hidden;white-space:nowrap;border-right:3px solid currentColor;width:0;animation:typing 6s steps(var(--n,30),end) infinite,caret .8s step-end infinite;vertical-align:bottom;max-width:100%}
@keyframes typing{0%{width:0}55%{width:calc(var(--n,30)*1ch)}85%{width:calc(var(--n,30)*1ch)}100%{width:0}}
@keyframes caret{50%{border-color:transparent}}
table.spec{width:100%;border-collapse:collapse;font-size:14px}
table.spec td{padding:11px 0;border-top:1px solid var(--ln)}table.spec td:last-child{text-align:right}
table.spec td:first-child{color:var(--mut)}
.note{background:var(--wh);border-radius:calc(var(--rk,1)*20px);padding:18px 20px;font-size:15px;line-height:1.5;margin-top:18px}
.note b{font-weight:500}
.wl{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:baseline;border-top:1px solid var(--ln);padding:8px 0}
.wl span{font:12px 'JetBrains Mono';color:var(--mut)}
.wl div{font-size:42px;line-height:1.15;white-space:nowrap;overflow:hidden;outline:none}
.wl div:focus{background:rgba(12,11,13,.04)}
.wgrid{display:grid;grid-template-columns:8fr 4fr;gap:16px;align-items:start}
.live{background:var(--ink);color:var(--pap);border-radius:calc(var(--rk,1)*24px);padding:24px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:96px}
.live .w{font-size:92px;line-height:1;letter-spacing:-2px}
.wv{display:inline-block;animation:wv 2.6s ease-in-out infinite alternate}
@keyframes wv{0%{font-variation-settings:'wght' var(--lo)}100%{font-variation-settings:'wght' var(--hi)}}
.geo{position:relative;height:340px;border-radius:calc(var(--rk,1)*24px);overflow:hidden;container-type:size}
.tester{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:22px;display:flex;flex-direction:column;gap:18px}
.tctl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;font-size:12px;color:var(--mut)}
.tctl label{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:4px}
.sw button{width:30px;height:30px;border-radius:999px;border:2px solid transparent;padding:0}
.sw button.on{border-color:var(--ink)}
.tout{border-radius:calc(var(--rk,1)*16px);padding:28px;min-height:200px;overflow-wrap:anywhere;outline:none;transition:background .2s,color .2s}
.samples{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.samples .tile.w8{grid-column:span 8}.samples .tile.w4{grid-column:span 4}.samples .tile.w6{grid-column:span 6}.samples .tile.w12{grid-column:span 12}
.r45{aspect-ratio:4/5}.r169{aspect-ratio:16/9}.r11{aspect-ratio:1/1}.r21{aspect-ratio:2/1}
.tile .bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:6px;opacity:0;transition:opacity .2s;z-index:3}
.tile:hover .bar,.tile:focus-within .bar{opacity:1}
.bar span{font:11px 'JetBrains Mono';background:rgba(255,255,255,.92);color:#111;padding:6px 10px;border-radius:999px}
.bar button{background:rgba(255,255,255,.92);color:#111;border:0;padding:6px 11px;font-size:12px;border-radius:999px}
.bar button[aria-pressed=true]{background:#111;color:#fff}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.pair{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:24px;display:flex;flex-direction:column;gap:12px}
.pair .why{font-size:12px;color:var(--mut)}
.pair .h{font-size:34px;line-height:1.05;letter-spacing:-.5px}
.pair .b{font-size:15px;line-height:1.5;color:var(--mut)}
.pair .f{font-size:13px;border-top:1px solid var(--ln);padding-top:10px;display:flex;justify-content:space-between}
.cyr{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.cyr button{height:64px;border:0;background:transparent;font-size:28px;border-radius:calc(var(--rk,1)*12px)}
.cyr button:hover{background:var(--soft)}
.cyr button.hl{background:#FFE6D6}
.glyph{background:var(--ink);color:var(--pap);border-radius:calc(var(--rk,1)*24px);display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:8px;overflow:hidden}
.glyph .g{font-size:220px;line-height:1.05;padding:10px 40px}
.glyph .i{padding:24px 32px;font:12px/1.8 'JetBrains Mono';color:#A5A09B}
.lic2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lic2 > div{border-radius:calc(var(--rk,1)*24px);padding:28px}
.lic2 .a{background:var(--ok)}.lic2 .b{background:var(--wh);font-size:14px;line-height:1.65}
.lic2 .a p{margin:12px 0 0;font-size:24px;line-height:1.25;letter-spacing:-.4px}
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.cta{background:var(--ink);color:var(--pap);border-radius:calc(var(--rk,1)*28px);padding:40px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:64px}
.cta p{margin:0;font-size:34px;line-height:1.1;letter-spacing:-1px}
.mbar{display:none}
.ann{position:absolute;border-radius:50%;pointer-events:none}
.annl{position:absolute;font-family:'JetBrains Mono',monospace;font-size:1.25cqw;line-height:1.15;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.fitl{white-space:nowrap;display:block;line-height:.86}
sup{font-size:.42em;vertical-align:.95em;margin-left:.03em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--pap);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}



.h4x{padding:22px 0 8px}
.h4cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:min(72vh,680px);min-height:460px}
.h4c{position:relative;display:block;border-radius:calc(var(--rk,1)*24px);overflow:hidden}
.h4l{position:absolute!important;inset:0;opacity:0;transition:opacity .6s ease;border-radius:0}
.h4l.on{opacity:1}
.h4c:nth-child(2){transform:translateY(24px)}
.h4cap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:34px 2px 0;font-size:14px}
.h4cap small{color:var(--mut);margin-left:6px}
.h4bar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-top:1px solid var(--ln);margin-top:18px;padding-top:18px}
.h4bar h1{margin:0;font-weight:400;font-size:clamp(34px,4.2vw,56px);line-height:1;letter-spacing:-1.6px}
.h4bar .plq{white-space:nowrap}
/* подбор */
.brief{padding-top:36px;padding-bottom:64px}
.brief h1{margin:0;font-weight:400;font-size:clamp(38px,5vw,64px);letter-spacing:-2px;line-height:1}
.bsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0}
.bstep{background:var(--wh);border-radius:calc(var(--rk,1)*24px);padding:22px;display:flex;flex-direction:column;gap:12px}
.bstep .q{font-size:20px;line-height:1.2}.bstep .q span{font:11px 'JetBrains Mono';color:var(--mut);display:block;margin-bottom:6px}
.bopts{display:flex;flex-wrap:wrap;gap:6px}
.bres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcard{background:var(--wh);border-radius:calc(var(--rk,1)*24px);overflow:hidden;display:flex;flex-direction:column}
.bcard .tile{aspect-ratio:4/5;border-radius:0}
.bcard .bi{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.bcard .why{display:flex;flex-wrap:wrap;gap:4px}.bcard .why span{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--soft)}
.bcard .sc{font:11px 'JetBrains Mono';color:var(--mut)}
@media(max-width:900px){.h4cards{grid-template-columns:1fr 1fr;height:auto}.h4c{aspect-ratio:3/4}.h4c:nth-child(3){display:none}.h4c:nth-child(2){transform:none}.h4cap{grid-template-columns:1fr 1fr}.bsteps,.bres{grid-template-columns:1fr}}
/* первый экран */
.h1x{padding:20px 0 8px}
.h1top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);padding:8px 0 18px;border-bottom:1px solid var(--ln)}
.h1stage{height:min(46vh,420px);display:flex;align-items:center;overflow:hidden}
.h1line{white-space:nowrap;line-height:1;letter-spacing:-.02em;transition:opacity .25s}
.h1bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--ln);padding:16px 0 8px}
.h1name{font-size:22px}
.h1ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.h1ctl input{min-width:min(340px,70vw);border:0;border-bottom:1px solid var(--ln);background:transparent;font:16px 'Golos Text';color:inherit;padding:8px 2px;outline:none}
.h2x{position:relative;padding:12px 32px 0}
.h2wall{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(220px,30vh));gap:8px}
.h2t{border-radius:calc(var(--rk,1)*20px);display:block}
.h2t0{grid-column:span 2}.h2t5{grid-column:span 2}
.h2t6,.h2t7{display:none}
.h2card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,86vw);background:var(--pap);border-radius:calc(var(--rk,1)*28px);padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.25);z-index:2}
.h2card h1{margin:0;font-weight:400;font-size:44px;line-height:1;letter-spacing:-1.5px}
.h2card .plq{white-space:nowrap}
.h2card p{margin:0;color:var(--mut);font-size:15px;line-height:1.5}
.h3x{position:relative;height:min(82vh,760px);min-height:560px;overflow:hidden}
.h3sky{position:absolute;inset:0}
.star3{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:#F1EFEA;transform:translate(-4px,-4px)}
.star3 i{width:6px;height:6px;border-radius:50%;background:#F1EFEA;box-shadow:0 0 10px rgba(255,255,255,.7);transition:.2s}
.star3 span{font-size:13px;opacity:.55;transition:.2s;white-space:nowrap}
.star3 b{font-weight:400;font-size:0;opacity:0;transition:.25s;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.star3:hover{z-index:3}.star3:hover i{background:#FF7122;box-shadow:0 0 18px #FF7122}.star3:hover span{opacity:1}
.star3:hover b{font-size:34px;opacity:1}
.h3c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(620px,90vw);display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2}
.h3c h1{margin:0;font-weight:400;font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-2px}
.h3c p{margin:0;color:#A5A09B!important;font-size:16px}
.h3c input{color:#F1EFEA;border-bottom-color:rgba(241,239,234,.3)}
.hsw{position:fixed;right:16px;bottom:62px;z-index:40;display:flex;gap:4px;background:rgba(12,11,13,.88);padding:5px;border-radius:999px}
.hsw button{border:0;background:transparent;color:#F1EFEA;font:500 12px 'Golos Text';padding:7px 12px;border-radius:999px}.hsw button.on{background:#FF7122;color:#0C0B0D}

// ---------- свайп шрифтов: учится на «нравится / нет» и подбирает лучшее совпадение
const FN={'c:Гротеск':'гротески','c:Антиква':'антиквы','c:Акцидентный':'акцидентные','c:Моно':'моноширинные','c:Рукописный':'рукописные',vf:'вариативные',family:'большие семьи',single:'одиночки с характером',it:'с курсивом',heavy:'плотные, жирные',light:'тонкие',fresh:'необычные',std:'проверенная классика'};
function feats(f){const o={['c:'+f[1]]:1};if(f[2]&&f[3]<f[4])o.vf=1;if(f[5]>=6)o.family=1;else if(f[5]<=2)o.single=1;if(f[6])o.it=1;if(f[4]>=800)o.heavy=1;if(f[3]<=200)o.light=1;o[isStd(f)?'std':'fresh']=1;return o}
let SW=lsGet('pada_swipe',{seen:{},w:{},n:0});let swCur=null,swNextF=null;
const swScore=f=>{let s=0;for(const k in feats(f))s+=SW.w[k]||0;return s};
function swPick(skip){const pool=FONTS.filter(f=>!(f[0] in SW.seen)&&f!==skip);if(!pool.length)return null;const n=SW.n;const fresh=pool.filter(f=>!isStd(f));
 if(n<7){const order=['Акцидентный','Антиква','Гротеск','Рукописный','Акцидентный','Моно','Антиква'];const p=fresh.filter(f=>f[1]===order[n]);return R(p.length?p:fresh.length?fresh:pool)}
 if(Math.random()<.22)return R(fresh.length?fresh:pool);
 return pool.map(f=>[f,swScore(f)+(isStd(f)?-1.5:0)+Math.random()*1.2]).sort((a,b)=>b[1]-a[1])[0][0]}
const SWT=['massive','swiss','glyph','plaque','index','catalogcard','marking','halftone','letterfield','rhythm','science','orbit'];
function swipe(){
 app.innerHTML=`<div class="wrap sw2"><div>
  <div class="mono" style="font-size:11px;color:var(--mut)">★ СВАЙП ШРИФТОВ · ${Object.keys(SW.seen).length} ОЦЕНЕНО</div>
  <h1 style="margin:10px 0 18px;font-weight:400;font-size:clamp(34px,4vw,52px);letter-spacing:-1.6px;line-height:1">Нравится или <span class="plq">нет?</span></h1>
  <div class="swst" id="swst"></div>
  <div class="swinfo"><b id="swn"></b><a id="swl" class="mono" style="font-size:12px;color:var(--mut)">открыть →</a></div>
  <div class="swbtn"><button class="n" type="button" data-v="-1">✕ Не моё<small>←</small></button><button class="s" type="button" data-v="0">Пропустить<small>↓</small></button><button class="y" type="button" data-v="1">♥ Нравится<small>→</small></button></div>
  <div style="font-size:13px;color:var(--mut);margin-top:12px">Карточку можно смахнуть мышкой или пальцем. «Нравится» сразу кладёт шрифт в Бортовой журнал.</div></div>
  <div class="taste" id="taste"></div></div>`;
 swCur=swPick();swNextF=swPick(swCur);swDraw();swTaste();
 document.querySelectorAll('.swbtn button').forEach(b=>b.onclick=()=>swVote(+b.dataset.v));
}
function swCard(f,back){const d=document.createElement('div');d.className='swc tile'+(back?' back':'');d.innerHTML='<div class="art"></div><div class="stamp y">НРАВИТСЯ</div><div class="stamp n">НЕ МОЁ</div>';const pi=Math.floor(Math.random()*PAL.length),tp='specimen';loadFont(f).then(()=>compose(d,f,tp,pi)).catch(()=>{});return d}
function swDraw(){const st=$('#swst');if(!st)return;st.innerHTML='';if(!swCur){st.innerHTML='<div class="empty">Ты оценил все шрифты базы</div>';return}
 if(swNextF)st.appendChild(swCard(swNextF,true));const c=swCard(swCur,false);st.appendChild(c);
 $('#swn').textContent=swCur[0];$('#swl').href='#/font/'+slug(swCur[0]);
 let x0=null,dx=0;c.onpointerdown=e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};
 c.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;c.querySelector('.stamp.y').style.opacity=Math.max(0,dx/120);c.querySelector('.stamp.n').style.opacity=Math.max(0,-dx/120)};
 c.onpointerup=()=>{if(x0==null)return;x0=null;c.style.transition='';if(Math.abs(dx)>110)swVote(dx>0?1:-1);else{c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}dx=0}}
let swBusy=false;function swVote(v){if(!swCur||swBusy)return;swBusy=true;const f=swCur;const c=document.querySelector('.swc:not(.back)');
 if(v!==0){SW.seen[f[0]]=v;SW.n++;const fs=feats(f);for(const k in fs)SW.w[k]=(SW.w[k]||0)+v*(k.startsWith('c:')?1:.6);if(v>0&&!isFav(f[0]))toggleFav(f[0])}
 lsSet('pada_swipe',SW);
 if(c){c.style.transform=v===0?'translateY(-40px) scale(.9)':`translateX(${v*140}%) rotate(${v*24}deg)`;c.style.opacity=0;if(v)c.querySelector('.stamp.'+(v>0?'y':'n')).style.opacity=1}
 setTimeout(()=>{swCur=swNextF||swPick();swNextF=swPick(swCur);swDraw();swTaste();const m=document.querySelector('.mono');if(m)m.textContent=`★ СВАЙП ШРИФТОВ · ${Object.keys(SW.seen).length} ОЦЕНЕНО`;swBusy=false},300)}
function swTaste(){const el=$('#taste');if(!el)return;const n=Object.keys(SW.seen).length;
 if(n<5){el.innerHTML=`<h2>Собираю твой вкус</h2><p style="color:var(--mut);margin:6px 0 18px">Оцени ещё ${5-n} ${plural2(5-n)}: первые карточки специально разные, чтобы понять, что тебе ближе.</p><div style="display:flex;gap:6px">${[0,1,2,3,4].map(i=>`<i style="flex:1;height:6px;border-radius:9px;background:${i<n?'var(--ink)':'var(--soft)'}"></i>`).join('')}</div>`;return}
 const ent=Object.entries(SW.w).filter(([k,v])=>FN[k]&&Math.abs(v)>=.5).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...ent.map(e=>Math.abs(e[1])));
 const likes=ent.filter(e=>e[1]>0).slice(0,3).map(e=>FN[e[0]]),dis=ent.filter(e=>e[1]<0).slice(-2).map(e=>FN[e[0]]);
 const best=FONTS.filter(f=>SW.seen[f[0]]!==-1).map(f=>[f,swScore(f)+(SW.seen[f[0]]===1?.4:0)]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
 el.innerHTML=`<div class="mono" style="font-size:11px;color:var(--mut)">ТВОЙ ВКУС · ${n} ОЦЕНОК</div><h2 style="margin-top:8px">${likes.length?'Тебе ближе '+esc(likes.join(', ')):'Пока без явных предпочтений'}</h2>${dis.length?`<p style="color:var(--mut);margin:4px 0 14px">Не заходят: ${esc(dis.join(', '))}</p>`:'<div style="height:14px"></div>'}
 ${ent.slice(0,8).map(([k,v])=>`<div class="tbar"><span>${FN[k]}</span><i><b style="${v>=0?'':'left:auto;right:50%;'}width:${Math.abs(v)/mx*50}%;background:${v>=0?'var(--ok)':'#B23A2E'}"></b></i><span class="mono" style="font-size:11px;color:var(--mut)">${v>0?'+':''}${v.toFixed(1)}</span></div>`).join('')}
 <div class="sh" style="margin-top:22px"><h2 style="font-size:22px"><span>✦</span>Лучшее совпадение</h2><button class="pill soft" type="button" id="swr">Начать заново</button></div>
 <div class="match">${best.map((f,i)=>`<a href="#/font/${slug(f[0])}"><div class="tile" data-m="${i}"><div class="art"></div></div><span>${esc(f[0])}${SW.seen[f[0]]===1?' ♥':''}</span></a>`).join('')}</div>`;
 best.forEach((f,i)=>loadFont(f).then(()=>compose(document.querySelector(`[data-m="${i}"]`),f,R(['glyph','index','plaque','massive']),Math.floor(Math.random()*PAL.length))).catch(()=>{}));
 $('#swr').onclick=()=>{swBusy=false;SW={seen:{},w:{},n:0};lsSet('pada_swipe',SW);swipe()}}
